name: arastirma-dongusu
on:
  schedule:
    - cron: "0 6 1 * *"   # her ayın 1'i 06:00 UTC = 09:00 Istanbul (aylık rol-model/kaynak döngüsü)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Research loop (geri oku -> arastir -> arsivle -> takvim -> zincir)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/research_loop.py
      - name: Validate components
        run: python3 scripts/validate.py
      - name: Commit
        run: |
          git config user.name "adops-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "arastirma-dongusu: $(date -u +%Y-%m)" || echo "no changes"
          git push || echo "push skipped"
