name: aylik-arastirma
on:
  schedule:
    - cron: "0 5 2 * *"   # 2nd of month 05:00 UTC — after board (1st)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  research-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Monthly archive read → research → stamp
        run: python3 scripts/monthly_research_refresh.py
      - name: Commit
        run: |
          git config user.name "adops-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "aylik-arastirma: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push || echo "push skipped"
